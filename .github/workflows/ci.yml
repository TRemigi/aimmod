name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Type-check frontend
        run: pnpm build

      - name: Ensure Tauri resource path exists
        shell: pwsh
        run: New-Item -ItemType Directory -Path src-tauri/ue4ss -Force | Out-Null

      # .cargo/config.toml routes rustc through sccache. On a cold Windows build sccache
      # fails with "filename or extension is too long" (os error 206) on long rustc command
      # lines; plain cargo falls back to an argument file instead. rust-cache still caches.
      - name: Check Rust
        run: cargo check
        working-directory: src-tauri
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""

      - name: Run security tests
        run: cargo test --lib -- hub_sync::tests overlay_service::request_check_tests
        working-directory: src-tauri
        env:
          RUSTC_WRAPPER: ""
          CARGO_BUILD_RUSTC_WRAPPER: ""
